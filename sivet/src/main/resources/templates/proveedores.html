<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>SIVET - Proveedores</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Segoe UI", Arial, sans-serif;
            background: #f4f8fb;
            color: #17365d;
        }

        /* =========================
           CONTENIDO PRINCIPAL
        ========================= */

        .main {
            margin-left: 305px;
            min-height: 100vh;
        }

        .content {
            padding: 30px;
        }

        /* =========================
           TOPBAR
        ========================= */

        .topbar {
            height: 75px;
            background: white;
            border-bottom: 1px solid #e1e9ef;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 30px;
        }

        .search {
            width: 430px;
            background: #f2f6f9;
            border-radius: 8px;
            padding: 11px 16px;
            color: #8a9aaa;
        }

        .user {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .avatar {
            width: 43px;
            height: 43px;
            border-radius: 50%;
            background: #07345b;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
        }

        /* =========================
           USUARIO
        ========================= */

        .user-menu {
            position: relative;
        }

        .user-button {
            display: flex;
            align-items: center;
            gap: 12px;
            border: none;
            background: transparent;
            cursor: pointer;
            padding: 4px;
            color: #17365d;
        }

        .user-info {
            text-align: left;
        }

        .user-info strong {
            display: block;
        }

        .user-info small {
            color: #8191a0;
        }

        .user-dropdown {
            display: none;
            position: absolute;
            right: 0;
            top: 55px;
            width: 210px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
            padding: 10px;
            z-index: 2000;
        }

        .user-dropdown.show {
            display: block;
        }

        .user-dropdown a,
        .user-dropdown button {
            width: 100%;
            display: block;
            padding: 10px 12px;
            border: none;
            background: white;
            text-align: left;
            text-decoration: none;
            color: #17365d;
            border-radius: 7px;
            font-size: 14px;
        }

        .user-dropdown a:hover,
        .user-dropdown button:hover {
            background: #f1f6f9;
        }

        .user-dropdown .logout {
            color: #df3d32;
            cursor: pointer;
        }

        /* =========================
           CONTENIDO
        ========================= */

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .page-header h1 {
            margin: 0;
            font-size: 31px;
            font-weight: 700;
        }

        .page-header p {
            margin: 5px 0 0;
            color: #687b8d;
        }

        /* =========================
           BOTÓN
        ========================= */

        .btn-sivet {
            background: #f47721;
            color: white;
            border: none;
            padding: 11px 18px;
            border-radius: 8px;
            font-weight: 600;
            text-decoration: none;
        }

        .btn-sivet:hover {
            background: #df681b;
            color: white;
        }

        /* =========================
           PANEL
        ========================= */

        .panel {
            background: white;
            border-radius: 12px;
            padding: 22px;
            box-shadow: 0 2px 8px rgba(30,60,90,0.06);
        }

        /* =========================
           TABLA
        ========================= */

        .table thead th {
            background: #f1f6f9;
            color: #526b80;
            font-size: 13px;
            border-bottom: 0;
        }

        .table tbody td {
            vertical-align: middle;
            font-size: 14px;
        }

        .ruc {
            font-weight: 700;
            color: #087ca8;
        }

        /* =========================
           ESTADOS
        ========================= */

        .estado-activo {
            background: #d8f5e8;
            color: #16824f;
            padding: 6px 11px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .estado-inactivo {
            background: #ffdeda;
            color: #d63c31;
            padding: 6px 11px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        /* =========================
           ACCIONES
        ========================= */

        .acciones {
            white-space: nowrap;
        }

        .acciones a,
        .acciones button {
            border: none;
            background: transparent;
            font-size: 18px;
            margin-right: 6px;
            text-decoration: none;
            cursor: pointer;
        }

        .editar {
            color: #087ca8;
        }

        .editar:hover {
            color: #055b7a;
        }

        .eliminar {
            color: #df3d32;
        }

        .eliminar:hover {
            color: #b82c24;
        }

        .form-eliminar {
            display: inline;
        }

        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 768px) {

            .main {
                margin-left: 0;
            }

            .topbar {
                flex-wrap: wrap;
                height: auto;
                gap: 15px;
                padding: 15px;
            }

            .search {
                width: 100%;
            }

            .page-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }

            .content {
                padding: 20px;
            }

        }

    </style>

</head>

<body>


<!-- ==================================================
     SIDEBAR UNIFICADO
================================================== -->

<div th:replace="~{fragments/sidebar :: sidebar}"></div>


<!-- ==================================================
     CONTENIDO PRINCIPAL
================================================== -->

<main class="main">


    <!-- TOPBAR -->

    <header class="topbar">

        <div class="search">

            <i class="bi bi-search"></i>

            Buscar productos, clientes, ventas...

        </div>


        <div class="user">

            <i class="bi bi-bell fs-5"></i>


            <!-- USUARIO -->

            <div class="user-menu">


                <button
                    class="user-button"
                    type="button"
                    onclick="toggleUserMenu()">


                    <!-- AVATAR -->

                    <div
                        class="avatar"
                        th:text="${session.usuario != null
                            ? session.usuario.nombreCompleto.substring(0,1).toUpperCase()
                            : 'U'}">

                        A

                    </div>


                    <!-- INFORMACIÓN -->

                    <div class="user-info">

                        <strong
                            th:text="${session.usuario != null
                                ? session.usuario.nombreCompleto
                                : 'Usuario'}">

                            Administrador SIVET

                        </strong>


                        <small
                            th:text="${session.usuario != null
                                ? (session.usuario.idRol == 1
                                    ? 'Administrador'
                                    : session.usuario.idRol == 2
                                        ? 'Vendedor'
                                        : 'Almacenero')
                                : 'Usuario'}">

                            Administrador

                        </small>

                    </div>


                    <i class="bi bi-chevron-down"></i>


                </button>


                <!-- MENÚ DEL USUARIO -->

                <div
                    id="userDropdown"
                    class="user-dropdown">


                    <a href="/">

                        <i class="bi bi-house me-2"></i>

                        Dashboard

                    </a>


                    <form
                        th:action="@{/logout}"
                        method="post">

                        <button
                            type="submit"
                            class="logout">

                            <i class="bi bi-box-arrow-right me-2"></i>

                            Cerrar sesión

                        </button>

                    </form>


                </div>

            </div>

        </div>

    </header>


    <!-- ==================================================
         CONTENIDO
    ================================================== -->

    <section class="content">


        <!-- ENCABEZADO -->

        <div class="page-header">


            <div>

                <h1>
                    Proveedores
                </h1>

                <p>
                    Gestiona las empresas que abastecen tu bodega.
                </p>

            </div>


            <!-- NUEVO PROVEEDOR -->

            <a
                th:href="@{/proveedores/nuevo}"
                class="btn-sivet">

                <i class="bi bi-plus-lg"></i>

                Nuevo proveedor

            </a>


        </div>


        <!-- ==================================================
             TABLA
        ================================================== -->

        <div class="panel">


            <div class="table-responsive">


                <table class="table table-hover">


                    <thead>

                        <tr>

                            <th>
                                ID
                            </th>

                            <th>
                                RUC
                            </th>

                            <th>
                                Razón social
                            </th>

                            <th>
                                Teléfono
                            </th>

                            <th>
                                Correo
                            </th>

                            <th>
                                Dirección
                            </th>

                            <th>
                                Estado
                            </th>

                            <th>
                                Acciones
                            </th>

                        </tr>

                    </thead>


                    <tbody>


                        <!-- PROVEEDORES -->

                        <tr
                            th:each="proveedor : ${proveedores}">


                            <!-- ID -->

                            <td
                                th:text="${proveedor.idProveedor}">

                                1

                            </td>


                            <!-- RUC -->

                            <td
                                class="ruc"
                                th:text="${proveedor.ruc}">

                                20100055237

                            </td>


                            <!-- RAZÓN SOCIAL -->

                            <td
                                th:text="${proveedor.razonSocial}">

                                ALICORP S.A.A.

                            </td>


                            <!-- TELÉFONO -->

                            <td
                                th:text="${proveedor.telefono != null && !proveedor.telefono.isBlank()
                                    ? proveedor.telefono
                                    : '-'}">

                                -

                            </td>


                            <!-- CORREO -->

                            <td
                                th:text="${proveedor.correo != null && !proveedor.correo.isBlank()
                                    ? proveedor.correo
                                    : '-'}">

                                -

                            </td>


                            <!-- DIRECCIÓN -->

                            <td
                                th:text="${proveedor.direccion != null && !proveedor.direccion.isBlank()
                                    ? proveedor.direccion
                                    : '-'}">

                                -

                            </td>


                            <!-- ESTADO -->

                            <td>

                                <span
                                    th:if="${proveedor.estado}"
                                    class="estado-activo">

                                    Activo

                                </span>


                                <span
                                    th:unless="${proveedor.estado}"
                                    class="estado-inactivo">

                                    Inactivo

                                </span>

                            </td>


                            <!-- ACCIONES -->

                            <td class="acciones">


                                <!-- EDITAR -->

                                <a
                                    class="editar"
                                    title="Editar"
                                    th:href="@{/proveedores/editar/{id}(id=${proveedor.idProveedor})}">

                                    <i class="bi bi-pencil-square"></i>

                                </a>


                                <!-- ELIMINAR -->

                                <form
                                    class="form-eliminar"
                                    method="post"
                                    th:action="@{/proveedores/eliminar/{id}(id=${proveedor.idProveedor})}"
                                    onsubmit="return confirm('¿Está seguro de eliminar este proveedor?');">


                                    <button
                                        type="submit"
                                        class="eliminar"
                                        title="Eliminar">

                                        <i class="bi bi-trash"></i>

                                    </button>


                                </form>


                            </td>


                        </tr>


                        <!-- SIN DATOS -->

                        <tr
                            th:if="${#lists.isEmpty(proveedores)}">


                            <td
                                colspan="8"
                                class="text-center py-4">

                                No hay proveedores registrados.

                            </td>


                        </tr>


                    </tbody>


                </table>


            </div>


        </div>


    </section>


</main>


<!-- ==================================================
     JAVASCRIPT
================================================== -->

<script>

    function toggleUserMenu() {

        const menu =
            document.getElementById("userDropdown");

        if (menu) {
            menu.classList.toggle("show");
        }

    }


    document.addEventListener(
        "click",
        function(event) {

            const userMenu =
                document.querySelector(".user-menu");

            const dropdown =
                document.getElementById("userDropdown");


            if (
                userMenu &&
                dropdown &&
                !userMenu.contains(event.target)
            ) {

                dropdown.classList.remove("show");

            }

        }
    );

</script>


</body>

</html>
