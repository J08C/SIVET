<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>SIVET - Categorías</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">


    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Segoe UI", Arial, sans-serif;
            background: #f4f8fb;
            color: #17365d;
        }


        /* =====================================================
           MAIN
        ===================================================== */

        .main {
            margin-left: 305px;
            min-height: 100vh;
        }


        /* =====================================================
           TOPBAR
        ===================================================== */

        .topbar {
            height: 75px;
            background: white;
            border-bottom: 1px solid #e1e9ef;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 30px;
        }


        .search {
            width: 430px;

            background: #f2f6f9;
            border-radius: 8px;

            padding: 11px 16px;

            color: #8a9aaa;
        }


        .search i {
            margin-right: 10px;
        }


        .user {
            display: flex;
            align-items: center;
            gap: 12px;
        }


        .avatar {
            width: 43px;
            height: 43px;

            border-radius: 50%;

            background: #07345b;
            color: white;

            display: flex;
            justify-content: center;
            align-items: center;

            font-weight: bold;
        }


        /* =====================================================
           USUARIO
        ===================================================== */

        .dropdown {
            position: relative;
        }


        .user-button {
            display: flex;
            align-items: center;

            gap: 12px;

            border: none;
            background: transparent;

            cursor: pointer;

            padding: 4px;

            color: #17365d;
        }


        .user-button:hover {
            opacity: 0.9;
        }


        .user-info {
            text-align: left;
        }


        .user-info strong {
            display: block;
        }


        .user-info small {
            color: #8191a0;
        }


        .user-dropdown {
            display: none;

            position: absolute;

            right: 0;
            top: 55px;

            width: 210px;

            background: white;

            border-radius: 10px;

            box-shadow:
                0 5px 20px rgba(0,0,0,0.15);

            padding: 10px;

            z-index: 2000;
        }


        .user-dropdown.show {
            display: block;
        }


        .dropdown-title {
            padding: 8px 10px;

            color: #17365d;

            font-weight: 600;
        }


        .dropdown-divider {
            border-top: 1px solid #e5e9ed;

            margin: 5px 0;
        }


        .dropdown-item {
            width: 100%;

            border: none;

            background: transparent;

            text-align: left;

            padding: 10px;

            border-radius: 7px;

            cursor: pointer;

            color: #17365d;
        }


        .dropdown-item:hover {
            background: #f2f6f9;
        }


        .dropdown-item i {
            margin-right: 8px;
        }


        .dropdown-item.logout {
            color: #df3d32;
        }


        /* =====================================================
           CONTENT
        ===================================================== */

        .content {
            padding: 30px;
        }


        .page-header {
            display: flex;

            justify-content: space-between;
            align-items: center;

            margin-bottom: 25px;
        }


        .page-header h1 {
            margin: 0;

            font-size: 31px;

            font-weight: 700;
        }


        .page-header p {
            margin: 5px 0 0;

            color: #687b8d;
        }


        .btn-sivet {
            background: #f47721;

            color: white;

            border: none;

            padding: 11px 18px;

            border-radius: 8px;

            font-weight: 600;

            text-decoration: none;
        }


        .btn-sivet:hover {
            background: #df681b;

            color: white;
        }


        /* =====================================================
           PANEL
        ===================================================== */

        .panel {
            background: white;

            border-radius: 12px;

            padding: 22px;

            box-shadow:
                0 2px 8px rgba(30,60,90,0.06);
        }


        /* =====================================================
           TABLA
        ===================================================== */

        .table thead th {
            background: #f1f6f9;

            color: #526b80;

            font-size: 13px;

            border-bottom: 0;
        }


        .table tbody td {
            vertical-align: middle;

            font-size: 14px;
        }


        .nombre-categoria {
            font-weight: 600;

            color: #087ca8;
        }


        /* =====================================================
           ACCIONES
        ===================================================== */

        .acciones {
            white-space: nowrap;
        }


        .acciones a,
        .acciones button {
            border: none;

            background: transparent;

            font-size: 18px;

            margin-right: 6px;

            text-decoration: none;

            cursor: pointer;
        }


        .editar {
            color: #087ca8;
        }


        .editar:hover {
            color: #055b7a;
        }


        .eliminar {
            color: #df3d32;
        }


        .eliminar:hover {
            color: #b82c24;
        }


        .form-eliminar {
            display: inline;
        }


        /* =====================================================
           RESPONSIVE
        ===================================================== */

        @media (max-width: 768px) {

            .main {
                margin-left: 0;
            }


            .topbar {
                flex-wrap: wrap;

                height: auto;

                gap: 15px;

                padding: 15px;
            }


            .search {
                width: 100%;
            }


            .page-header {
                flex-direction: column;

                align-items: flex-start;

                gap: 15px;
            }

        }

    </style>

</head>


<body>


<!-- =====================================================
     SIDEBAR ÚNICO
===================================================== -->

<div th:replace="~{fragments/sidebar :: sidebar}"></div>


<!-- =====================================================
     MAIN
===================================================== -->

<main class="main">


    <!-- =================================================
         TOPBAR
    ================================================== -->

    <header class="topbar">


        <div class="search">

            <i class="bi bi-search"></i>

            Buscar productos, clientes, ventas...

        </div>


        <div class="user">


            <i class="bi bi-bell fs-5"></i>


            <div class="dropdown">


                <button
                    class="user-button"
                    type="button"
                    onclick="toggleUserMenu()">


                    <!-- AVATAR -->

                    <div
                        class="avatar"
                        th:text="${session.usuario != null
                            ? session.usuario.nombreCompleto.substring(0,1).toUpperCase()
                            : 'U'}">

                        A

                    </div>


                    <!-- USUARIO -->

                    <div class="user-info">


                        <strong
                            th:text="${session.usuario != null
                                ? session.usuario.nombreCompleto
                                : 'Usuario'}">

                            Administrador SIVET

                        </strong>


                        <small
                            th:text="${session.usuario != null
                                ? (session.usuario.idRol == 1
                                    ? 'Administrador'
                                    : session.usuario.idRol == 2
                                        ? 'Vendedor'
                                        : 'Almacenero')
                                : 'Usuario'}">

                            Administrador

                        </small>


                    </div>


                    <i class="bi bi-chevron-down"></i>


                </button>


                <!-- MENÚ DE USUARIO -->

                <div
                    id="userMenu"
                    class="user-dropdown">


                    <div class="dropdown-title">

                        <i class="bi bi-person-circle"></i>

                        Cuenta

                    </div>


                    <div class="dropdown-divider"></div>


                    <a
                        href="/"
                        class="dropdown-item text-decoration-none">

                        <i class="bi bi-speedometer2"></i>

                        Dashboard

                    </a>


                    <form
                        th:action="@{/logout}"
                        method="post">


                        <button
                            type="submit"
                            class="dropdown-item logout">

                            <i class="bi bi-box-arrow-right"></i>

                            Cerrar sesión

                        </button>


                    </form>


                </div>


            </div>


        </div>


    </header>


    <!-- =================================================
         CONTENIDO
    ================================================== -->

    <section class="content">


        <!-- HEADER -->

        <div class="page-header">


            <div>


                <h1>
                    Categorías
                </h1>


                <p>
                    Gestiona las categorías de productos
                    de tu bodega.
                </p>


            </div>


            <a
                href="/categorias/nuevo"
                class="btn-sivet">


                <i class="bi bi-plus-lg"></i>

                Nueva categoría


            </a>


        </div>


        <!-- =================================================
             PANEL
        ================================================== -->

        <div class="panel">


            <div class="table-responsive">


                <table class="table table-hover">


                    <thead>


                        <tr>


                            <th>
                                ID
                            </th>


                            <th>
                                Nombre de categoría
                            </th>


                            <th>
                                Acciones
                            </th>


                        </tr>


                    </thead>


                    <tbody>


                        <!-- CATEGORÍAS -->

                        <tr
                            th:each="categoria : ${categorias}">


                            <td
                                th:text="${categoria.idCategoria}">

                                1

                            </td>


                            <td
                                class="nombre-categoria"
                                th:text="${categoria.nombre}">

                                Abarrotes

                            </td>


                            <td class="acciones">


                                <!-- EDITAR -->

                                <a
                                    class="editar"
                                    title="Editar"
                                    th:href="@{/categorias/editar/{id}(id=${categoria.idCategoria})}">


                                    <i
                                        class="bi bi-pencil-square">
                                    </i>


                                </a>


                                <!-- ELIMINAR -->

                                <form
                                    class="form-eliminar"
                                    method="post"
                                    th:action="@{/categorias/eliminar/{id}(id=${categoria.idCategoria})}"
                                    onsubmit="return confirm('¿Está seguro de eliminar esta categoría?');">


                                    <button
                                        type="submit"
                                        class="eliminar"
                                        title="Eliminar">


                                        <i
                                            class="bi bi-trash">
                                        </i>


                                    </button>


                                </form>


                            </td>


                        </tr>


                        <!-- SIN CATEGORÍAS -->

                        <tr
                            th:if="${#lists.isEmpty(categorias)}">


                            <td
                                colspan="3"
                                class="text-center py-4">


                                No hay categorías registradas.


                            </td>


                        </tr>


                    </tbody>


                </table>


            </div>


        </div>


    </section>


</main>


<!-- =====================================================
     JAVASCRIPT
===================================================== -->

<script>


    function toggleUserMenu() {

        const menu =
            document.getElementById("userMenu");


        if (menu) {

            menu.classList.toggle("show");

        }

    }


    document.addEventListener(
        "click",
        function(event) {


            const dropdown =
                document.querySelector(".dropdown");


            const menu =
                document.getElementById("userMenu");


            if (
                dropdown &&
                menu &&
                !dropdown.contains(event.target)
            ) {

                menu.classList.remove("show");

            }


        }
    );


</script>


</body>

</html>
