<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>SIVET - Iniciar sesión</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            min-height: 100vh;

            font-family:
                "Segoe UI",
                Arial,
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #052b4c 0%,
                    #073e68 45%,
                    #0b9fc1 100%
                );

            display: flex;

            align-items: center;

            justify-content: center;

            overflow: hidden;

            position: relative;

        }


        /* =========================
           FONDO DECORATIVO
        ========================= */

        .background-circle {

            position: absolute;

            border-radius: 50%;

            background:
                rgba(255, 255, 255, 0.06);

            pointer-events: none;

        }


        .circle-one {

            width: 450px;

            height: 450px;

            top: -180px;

            left: -150px;

        }


        .circle-two {

            width: 550px;

            height: 550px;

            bottom: -280px;

            right: -180px;

        }


        .circle-three {

            width: 180px;

            height: 180px;

            top: 18%;

            right: 13%;

            background:
                rgba(255, 140, 0, 0.08);

        }


        /* =========================
           CONTENEDOR
        ========================= */

        .login-wrapper {

            width: 100%;

            max-width: 460px;

            padding: 25px;

            position: relative;

            z-index: 2;

        }


        /* =========================
           CARD
        ========================= */

        .login-card {

            background: rgba(255, 255, 255, 0.98);

            border-radius: 18px;

            padding: 38px 40px 30px;

            box-shadow:
                0 25px 60px
                rgba(0, 0, 0, 0.22);

        }


        /* =========================
           LOGO
        ========================= */

        .logo-container {

            text-align: center;

            margin-bottom: 28px;

        }


        .logo-icon {

            width: 72px;

            height: 72px;

            margin: 0 auto 15px;

            border-radius: 18px;

            background:
                linear-gradient(
                    135deg,
                    #07345b,
                    #0b9fc1
                );

            color: white;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 36px;

            box-shadow:
                0 8px 20px
                rgba(7, 52, 91, 0.25);

        }


        .logo-container h1 {

            margin: 0;

            color: #07345b;

            font-size: 34px;

            font-weight: 800;

            letter-spacing: 1px;

        }


        .logo-container p {

            margin: 5px 0 0;

            color: #708395;

            font-size: 14px;

        }


        /* =========================
           WELCOME
        ========================= */

        .welcome-text {

            text-align: center;

            margin-bottom: 25px;

        }


        .welcome-text h2 {

            margin: 0;

            color: #17365d;

            font-size: 22px;

            font-weight: 700;

        }


        .welcome-text p {

            margin: 6px 0 0;

            color: #7a8b99;

            font-size: 14px;

        }


        /* =========================
           FORM
        ========================= */

        .form-group {

            margin-bottom: 20px;

        }


        .form-label {

            display: block;

            margin-bottom: 8px;

            color: #17365d;

            font-size: 14px;

            font-weight: 600;

        }


        .input-wrapper {

            position: relative;

        }


        .input-icon {

            position: absolute;

            left: 15px;

            top: 50%;

            transform: translateY(-50%);

            color: #7f94a5;

            font-size: 18px;

            z-index: 2;

        }


        .form-control {

            width: 100%;

            height: 50px;

            padding:
                10px
                45px
                10px
                45px;

            border:
                1px solid #d8e2e9;

            border-radius: 9px;

            background: #f8fafc;

            color: #17365d;

            font-size: 15px;

            transition: 0.2s;

        }


        .form-control::placeholder {

            color: #a0aebb;

        }


        .form-control:focus {

            background: white;

            border-color: #0b9fc1;

            outline: none;

            box-shadow:
                0 0 0 4px
                rgba(11, 159, 193, 0.10);

        }


        /* =========================
           PASSWORD BUTTON
        ========================= */

        .password-toggle {

            position: absolute;

            right: 14px;

            top: 50%;

            transform: translateY(-50%);

            border: none;

            background: transparent;

            color: #7f94a5;

            font-size: 18px;

            cursor: pointer;

            padding: 3px;

        }


        .password-toggle:hover {

            color: #0b9fc1;

        }


        /* =========================
           ERROR
        ========================= */

        .error-message {

            background: #fff1f0;

            border:
                1px solid #ffd3cf;

            border-left:
                4px solid #df3d32;

            color: #a82c25;

            padding: 12px 14px;

            border-radius: 8px;

            margin-bottom: 20px;

            font-size: 13px;

        }


        .error-message i {

            margin-right: 6px;

        }


        /* =========================
           LOGIN BUTTON
        ========================= */

        .btn-login {

            width: 100%;

            height: 50px;

            border: none;

            border-radius: 9px;

            background:
                linear-gradient(
                    135deg,
                    #087ca8,
                    #0b9fc1
                );

            color: white;

            font-size: 15px;

            font-weight: 700;

            cursor: pointer;

            transition:
                transform 0.2s,
                box-shadow 0.2s,
                background 0.2s;

            box-shadow:
                0 6px 16px
                rgba(11, 159, 193, 0.25);

        }


        .btn-login:hover {

            transform: translateY(-1px);

            box-shadow:
                0 9px 20px
                rgba(11, 159, 193, 0.32);

            background:
                linear-gradient(
                    135deg,
                    #076b91,
                    #088daa
                );

        }


        .btn-login:active {

            transform: translateY(0);

        }


        .btn-login i {

            margin-right: 7px;

        }


        /* =========================
           FOOTER
        ========================= */

        .login-footer {

            text-align: center;

            margin-top: 25px;

            padding-top: 20px;

            border-top:
                1px solid #e7edf1;

            color: #8a9aa8;

            font-size: 12px;

        }


        .login-footer strong {

            color: #07345b;

        }


        .security {

            margin-top: 8px;

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 5px;

            color: #6c8394;

        }


        .security i {

            color: #16824f;

        }


        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 520px) {

            body {

                overflow-y: auto;

            }


            .login-wrapper {

                padding: 18px;

            }


            .login-card {

                padding:
                    30px 24px 25px;

            }


            .logo-icon {

                width: 64px;

                height: 64px;

                font-size: 31px;

            }


            .logo-container h1 {

                font-size: 30px;

            }


            .welcome-text h2 {

                font-size: 20px;

            }

        }

    </style>

</head>


<body>


<!-- =========================
     FONDO
========================= -->

<div class="background-circle circle-one"></div>

<div class="background-circle circle-two"></div>

<div class="background-circle circle-three"></div>


<!-- =========================
     LOGIN
========================= -->

<div class="login-wrapper">

    <div class="login-card">


        <!-- LOGO -->

        <div class="logo-container">

            <div class="logo-icon">

                <i class="bi bi-cart3"></i>

            </div>


            <h1>
                SIVET
            </h1>


            <p>
                Sistema de Inventario y Ventas
            </p>

        </div>


        <!-- BIENVENIDA -->

        <div class="welcome-text">

            <h2>
                ¡Bienvenido!
            </h2>

            <p>
                Ingresa tus credenciales para continuar
            </p>

        </div>


        <!-- ERROR -->

        <div
            th:if="${error}"
            class="error-message">

            <i class="bi bi-exclamation-triangle-fill"></i>

            <span th:text="${error}">
                Usuario o contraseña incorrectos.
            </span>

        </div>


        <!-- FORMULARIO -->

        <form
            th:action="@{/login}"
            method="post">


            <!-- USUARIO -->

            <div class="form-group">

                <label
                    for="usuario"
                    class="form-label">

                    Usuario

                </label>


                <div class="input-wrapper">

                    <i
                        class="bi bi-person input-icon">
                    </i>


                    <input
                        type="text"
                        id="usuario"
                        name="usuario"
                        class="form-control"
                        placeholder="Ingresa tu usuario"
                        autocomplete="username"
                        required
                        autofocus>

                </div>

            </div>


            <!-- CONTRASEÑA -->

            <div class="form-group">

                <label
                    for="contrasena"
                    class="form-label">

                    Contraseña

                </label>


                <div class="input-wrapper">

                    <i
                        class="bi bi-lock input-icon">
                    </i>


                    <input
                        type="password"
                        id="contrasena"
                        name="contrasena"
                        class="form-control"
                        placeholder="Ingresa tu contraseña"
                        autocomplete="current-password"
                        required>


                    <button
                        type="button"
                        class="password-toggle"
                        id="togglePassword"
                        title="Mostrar contraseña">

                        <i
                            class="bi bi-eye"
                            id="passwordIcon">
                        </i>

                    </button>

                </div>

            </div>


            <!-- BOTÓN -->

            <button
                type="submit"
                class="btn-login">

                <i class="bi bi-box-arrow-in-right"></i>

                Iniciar sesión

            </button>


        </form>


        <!-- FOOTER -->

        <div class="login-footer">

            <strong>
                SIVET v1.0.0
            </strong>

            <div>
                Sistema de Inventario y Ventas
            </div>


            <div class="security">

                <i class="bi bi-shield-check"></i>

                Acceso seguro al sistema

            </div>

        </div>


    </div>

</div>


<!-- =========================
     JAVASCRIPT
========================= -->

<script>

    const passwordInput =
        document.getElementById("contrasena");

    const togglePassword =
        document.getElementById("togglePassword");

    const passwordIcon =
        document.getElementById("passwordIcon");


    togglePassword.addEventListener(
        "click",
        function () {

            const isPassword =
                passwordInput.type === "password";


            passwordInput.type =
                isPassword
                    ? "text"
                    : "password";


            passwordIcon.className =
                isPassword
                    ? "bi bi-eye-slash"
                    : "bi bi-eye";


            togglePassword.title =
                isPassword
                    ? "Ocultar contraseña"
                    : "Mostrar contraseña";

        }
    );

</script>


</body>

</html>
